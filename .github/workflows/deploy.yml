name: Build and deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
  schedule:
    - cron: '38 3 * * *'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  build-darwin-unstable-options:
    uses: ./.github/workflows/build-options.yml
    with:
      repository: nix-darwin/nix-darwin
      ref: refs/heads/master
      path: nix-darwin
      doc-dir: darwin
      file: release.nix
      attribute: docs.optionsJSON
      runs-on: macos-15
      nixpkgs-branch: nixpkgs-unstable
  build-home-manager-unstable-options:
    uses: ./.github/workflows/build-options.yml
    with:
      repository: nix-community/home-manager
      ref: refs/heads/master
      path: home-manager
      doc-dir: home-manager
      file: default.nix
      attribute: docs.json
      runs-on: ubuntu-latest
      nixpkgs-branch: nixpkgs-unstable
  build-nur-packages:
    uses: ./.github/workflows/build-nur-packages.yml

  build-darwin-stable-options:
    uses: ./.github/workflows/build-options.yml
    with:
      repository: LnL7/nix-darwin
      ref: refs/heads/nix-darwin-26.05
      path: nix-darwin-stable
      doc-dir: darwin
      file: release.nix
      attribute: docs.optionsJSON
      runs-on: macos-15
      nixpkgs-branch: nixpkgs-26.05-darwin
  build-home-manager-stable-options:
    uses: ./.github/workflows/build-options.yml
    with:
      repository: nix-community/home-manager
      ref: refs/heads/release-26.05
      path: home-manager-stable
      doc-dir: home-manager
      file: default.nix
      attribute: docs.json
      runs-on: ubuntu-latest
      nixpkgs-branch: nixpkgs-26.05

  assemble:
    runs-on: ubuntu-latest
    needs:
      - build-darwin-unstable-options
      - build-home-manager-unstable-options
      - build-darwin-stable-options
      - build-home-manager-stable-options
      - build-nur-packages
    steps:
      - name: Merge build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          merge-multiple: true
          path: site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs:
      - assemble
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
